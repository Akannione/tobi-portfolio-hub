          <text x="16" y="69" font-size="28" font-weight="850" fill="#172033">42</text>
          <text x="16" y="102" font-size="13" fill="#657386">Active patients</text>
        </g>
        <g transform="translate(564 0)">
          <rect width="170" height="132" rx="8" fill="#ffffff" stroke="#d9e1ea"/>
          <text x="16" y="30" font-size="13" font-weight="800" fill="#657386">CONVERSION</text>
          <text x="16" y="69" font-size="28" font-weight="850" fill="#172033">34%</text>
          <text x="16" y="102" font-size="13" fill="#657386">Inquiry to patient rate</text>
        </g>
        <g transform="translate(752 0)">
          <rect width="170" height="132" rx="8" fill="#ffffff" stroke="#d9e1ea"/>
          <text x="16" y="30" font-size="13" font-weight="800" fill="#657386">NEW WEEK</text>
          <text x="16" y="69" font-size="28" font-weight="850" fill="#172033">8</text>
          <text x="16" y="102" font-size="13" fill="#657386">New inquiries</text>
        </g>
        <g transform="translate(940 0)">
          <rect width="170" height="132" rx="8" fill="#ffffff" stroke="#d9e1ea"/>
          <text x="16" y="30" font-size="13" font-weight="800" fill="#657386">TOP SOURCE</text>
          <text x="16" y="69" font-size="25" font-weight="850" fill="#172033">Referral</text>
          <text x="16" y="102" font-size="13" fill="#657386">Best inquiry source</text>
        </g>
      </g>

