        <g transform="translate(22 125)" font-size="15" fill="#172033">
          <line x1="0" y1="0" x2="646" y2="0" stroke="#e7edf3"/>
          <text x="0" y="33" font-weight="750">Maya Johnson</text>
          <text x="182" y="33" fill="#657386">Website</text>
          <rect x="318" y="12" width="128" height="28" rx="14" fill="#fff0cf"/>
          <text x="382" y="31" text-anchor="middle" font-size="12" font-weight="850" fill="#8a5a00">FOLLOW-UP</text>
          <text x="492" y="33" fill="#657386">Today</text>
          <line x1="0" y1="56" x2="646" y2="56" stroke="#e7edf3"/>

          <text x="0" y="89" font-weight="750">Chris Allen</text>
          <text x="182" y="89" fill="#657386">Referral</text>
          <rect x="318" y="68" width="150" height="28" rx="14" fill="#e4edff"/>
          <text x="393" y="87" text-anchor="middle" font-size="12" font-weight="850" fill="#274f9f">CONSULTATION</text>
          <text x="492" y="89" fill="#657386">Jun 13</text>
          <line x1="0" y1="112" x2="646" y2="112" stroke="#e7edf3"/>

          <text x="0" y="145" font-weight="750">Dana Brooks</text>
          <text x="182" y="145" fill="#657386">Google</text>
          <rect x="318" y="124" width="118" height="28" rx="14" fill="#dff7e7"/>
          <text x="377" y="143" text-anchor="middle" font-size="12" font-weight="850" fill="#176b4d">ACTIVE</text>
          <text x="492" y="145" fill="#657386">Jun 14</text>
          <line x1="0" y1="168" x2="646" y2="168" stroke="#e7edf3"/>

          <text x="0" y="201" font-weight="750">Jordan Price</text>
          <text x="182" y="201" fill="#657386">Insurance</text>
          <rect x="318" y="180" width="128" height="28" rx="14" fill="#fff0cf"/>
          <text x="382" y="199" text-anchor="middle" font-size="12" font-weight="850" fill="#8a5a00">FOLLOW-UP</text>
          <text x="492" y="201" fill="#657386">Overdue</text>
        </g>
      </g>

      <g transform="translate(1020 408)" font-family="Inter, Arial, sans-serif">
        <rect width="368" height="356" rx="8" fill="#ffffff" stroke="#d9e1ea"/>
        <text x="22" y="38" font-size="22" font-weight="800" fill="#172033">Follow-Up Focus</text>
        <text x="22" y="66" font-size="15" fill="#657386">Handle these conversations first.</text>
        <text x="22" y="111" font-size="15" font-weight="850" fill="#8f1d1d">Overdue</text>
        <g transform="translate(22 126)">
          <rect width="324" height="58" rx="8" fill="#fff3f3"/>
          <text x="14" y="24" font-size="15" font-weight="800" fill="#8f1d1d">Jordan Price</text>
          <text x="14" y="44" font-size="13" fill="#8f1d1d">Insurance question needs callback</text>
        </g>
        <g transform="translate(22 194)">
          <rect width="324" height="58" rx="8" fill="#fff3f3"/>
          <text x="14" y="24" font-size="15" font-weight="800" fill="#8f1d1d">Ari Walker</text>
          <text x="14" y="44" font-size="13" fill="#8f1d1d">Missed intake form follow-up</text>
        </g>
        <text x="22" y="292" font-size="15" font-weight="850" fill="#795600">Due Today</text>
        <g transform="translate(22 307)">
          <rect width="324" height="34" rx="8" fill="#fff9e8"/>
          <text x="14" y="23" font-size="14" font-weight="800" fill="#795600">Maya Johnson - new website inquiry</text>
        </g>
