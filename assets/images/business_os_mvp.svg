          <text x="16" y="69" font-size="28" font-weight="850" fill="#172033">11</text>
          <text x="16" y="102" font-size="13" fill="#657386">Need staff action</text>
        </g>
        <g transform="translate(376 0)">
          <rect width="170" height="132" rx="8" fill="#f5fff7" stroke="#97d3a6"/>
